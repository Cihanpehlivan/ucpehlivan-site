name: Siteyi yayına al

on:
  workflow_dispatch:
    inputs:
      hedef:
        description: "Nereye yüklensin?"
        type: choice
        options:
          - onizleme
          - canli
        default: onizleme

jobs:
  yayinla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: İçeriği Firestore'dan al ve sayfaları üret
        run: node scripts/publish.mjs

      - name: Firebase Hosting'e yükle
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_UCPEHLIVAN }}
          projectId: ucpehlivan
          channelId: ${{ inputs.hedef == 'canli' && 'live' || 'onizleme' }}
          expires: 7d
