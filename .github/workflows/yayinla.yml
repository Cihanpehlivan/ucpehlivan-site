name: Siteyi yayına al

on:
  workflow_dispatch:
    inputs:
      hedef:
        description: "Nereye yüklensin?"
        type: choice
        options:
          - onizleme
          - canli
        default: onizleme

jobs:
  yayinla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: İçeriği Firestore'dan al ve sayfaları üret
        run: node scripts/publish.mjs

      # Metninde yer tutucu ([DÜZENLE], [SÜRE], [ÖRNEK: …]) kalan yazı sayfası canlıya çıkmaz; önizlemede görünür.
      - name: Yer tutuculu yazıları canlıdan çıkar
        if: inputs.hedef == 'canli'
        run: |
          for d in public/yazi/*/; do
            if grep -rqE '\[(DÜZENLE|SÜRE|ÖRNEK:)' "$d"; then
              echo "::warning::$d yer tutucu içeriyor, canlı yayına alınmadı."
              rm -rf "$d"
            fi
          done

      - name: Firebase Hosting'e yükle
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_UCPEHLIVAN }}
          projectId: ucpehlivan
          channelId: ${{ inputs.hedef == 'canli' && 'live' || 'onizleme' }}
          expires: 7d

      # IndexNow: canlı yayından sonra site haritasındaki adresleri Bing/Yandex'e bildirir (ücretsiz).
      # Anahtar gizli değildir; doğrulama için public/<anahtar>.txt herkese açık durmalıdır.
      - name: Arama motorlarına bildir (IndexNow)
        if: inputs.hedef == 'canli'
        continue-on-error: true
        env:
          INDEXNOW_KEY: ea58339bf86fb6753cfb4a481016fe5f
        run: |
          node -e '
            const fs = require("fs"), k = process.env.INDEXNOW_KEY, h = "ucpehlivan.web.app";
            const urls = [...fs.readFileSync("public/sitemap.xml", "utf8").matchAll(/<loc>([^<]+)<\/loc>/g)].map((m) => m[1]);
            console.log(JSON.stringify({ host: h, key: k, keyLocation: "https://" + h + "/" + k + ".txt", urlList: urls }));
          ' > indexnow.json
          curl -sS -o /dev/null -w "IndexNow: %{http_code}\n" -X POST https://api.indexnow.org/indexnow -H "Content-Type: application/json; charset=utf-8" --data @indexnow.json
