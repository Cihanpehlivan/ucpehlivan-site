name: Siteyi yayına al

on:
  workflow_dispatch:
    inputs:
      hedef:
        description: "Nereye yüklensin?"
        type: choice
        options:
          - onizleme
          - canli
        default: onizleme
  # Her sabah 07:00 (TR): yeni YouTube videosu veya admin'de kaydedilmiş yeni içerik varsa canlıyı yeniler.
  schedule:
    - cron: '0 4 * * *'

jobs:
  yayinla:
    runs-on: ubuntu-latest
    env:
      HEDEF: ${{ inputs.hedef || 'canli' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: İçeriği Firestore'dan al ve sayfaları üret
        run: node scripts/publish.mjs

      # Zamanlı çalışma: video listesi ve içerik sürümü canlıdakiyle aynıysa yükleme yapılmaz.
      # İçerik sürümü: admin'de "Kaydet" Firestore'daki paketi (ucp-version) yeniler. Canlı statik sayfa
      # eski sürümde kalırsa ziyaretçi önce eski içeriği görür, sonra hydrate yenisini çizer (ör. pasife
      # alınan yazı bir an görünüp kaybolur). Sürüm farklıysa canlı yenilenir.
      - name: Video listesi veya içerik değişti mi?
        id: degisim
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "yukle=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          surum() { grep -o 'name="ucp-version" content="[^"]*"' | head -1; }
          canli=$(curl -sf https://ucpehlivan.web.app/ | surum || true)
          yeni=$(surum < public/index.html || true)
          if [ -z "$canli" ] || [ "$canli" != "$yeni" ]; then
            echo "İçerik sürümü değişti ($canli → $yeni)."; echo "yukle=1" >> "$GITHUB_OUTPUT"
          elif curl -sf https://ucpehlivan.web.app/videos.json | cmp -s - public/videos.json; then
            echo "Video listesi ve içerik aynı, yükleme yok."; echo "yukle=0" >> "$GITHUB_OUTPUT"
          else echo "yukle=1" >> "$GITHUB_OUTPUT"; fi

      # Metninde yer tutucu ([DÜZENLE], [SÜRE], [ÖRNEK: …]) kalan yazı sayfası canlıya çıkmaz; önizlemede görünür.
      - name: Yer tutuculu yazıları canlıdan çıkar
        if: env.HEDEF == 'canli' && steps.degisim.outputs.yukle == '1'
        run: |
          for d in public/yazi/*/; do
            if grep -rqE '\[(DÜZENLE|SÜRE|ÖRNEK:)' "$d"; then
              echo "::warning::$d yer tutucu içeriyor, canlı yayına alınmadı."
              rm -rf "$d"
            fi
          done

      - name: Firebase Hosting'e yükle
        if: steps.degisim.outputs.yukle == '1'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_UCPEHLIVAN }}
          projectId: ucpehlivan
          channelId: ${{ env.HEDEF == 'canli' && 'live' || 'onizleme' }}
          expires: 7d

      # IndexNow: canlı yayından sonra site haritasındaki adresleri Bing/Yandex'e bildirir (ücretsiz).
      # Anahtar gizli değildir; doğrulama için public/<anahtar>.txt herkese açık durmalıdır.
      - name: Arama motorlarına bildir (IndexNow)
        if: env.HEDEF == 'canli' && steps.degisim.outputs.yukle == '1'
        continue-on-error: true
        env:
          INDEXNOW_KEY: ea58339bf86fb6753cfb4a481016fe5f
        run: |
          node -e '
            const fs = require("fs"), k = process.env.INDEXNOW_KEY, h = "ucpehlivan.web.app";
            const urls = [...fs.readFileSync("public/sitemap.xml", "utf8").matchAll(/<loc>([^<]+)<\/loc>/g)].map((m) => m[1]);
            console.log(JSON.stringify({ host: h, key: k, keyLocation: "https://" + h + "/" + k + ".txt", urlList: urls }));
          ' > indexnow.json
          curl -sS -o /dev/null -w "IndexNow: %{http_code}\n" -X POST https://api.indexnow.org/indexnow -H "Content-Type: application/json; charset=utf-8" --data @indexnow.json
